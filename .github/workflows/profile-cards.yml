name: profile summary cards

on:
  schedule:
    - cron: "0 19 * * *"      # 03:00 Asia/Shanghai
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: guanggaozheme6
          BRANCH_NAME: profile-summary-card-output
          THEME: radical
          UTC_OFFSET: 8
