<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="HUAKUN">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07080c"/>
      <stop offset="0.5" stop-color="#121620"/>
      <stop offset="1" stop-color="#07080c"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fe3ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6fe3ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6fe3ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6fa5" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ff6fa5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1b2130" stroke-width="1"/>
    </pattern>
    <style>
      .scan { animation: scan 5s linear infinite; }
      .br   { animation: pulse 3.2s ease-in-out infinite; }
      .halo { animation: pulse 4.5s ease-in-out infinite; }
      .g1   { animation: g1 6.5s infinite; }
      .g2   { animation: g2 6.5s infinite; }
      @keyframes scan {
        0%   { transform: translateY(-80px); opacity: 0; }
        12%  { opacity: 1; }
        88%  { opacity: 1; }
        100% { transform: translateY(320px); opacity: 0; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.22; }
        50%      { opacity: 0.85; }
      }
      @keyframes g1 {
        0%, 90%, 100% { opacity: 0; transform: translate(0, 0); }
        91% { opacity: 0.9; transform: translate(-6px, 2px); }
        94% { opacity: 0.9; transform: translate(5px, -3px); }
        97% { opacity: 0;   transform: translate(-3px, 1px); }
      }
      @keyframes g2 {
        0%, 91%, 100% { opacity: 0; transform: translate(0, 0); }
        92% { opacity: 0.75; transform: translate(6px, -2px); }
        95% { opacity: 0.75; transform: translate(-5px, 3px); }
        98% { opacity: 0;    transform: translate(3px, -1px); }
      }
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.55"/>
  <ellipse class="halo" cx="600" cy="150" rx="420" ry="130" fill="url(#glow)"/>

  <text class="g1" x="600" y="158" text-anchor="middle" font-family="'Courier New',Consolas,monospace" font-size="86" font-weight="700" letter-spacing="12" fill="#6fe3ff">HUAKUN</text>
  <text class="g2" x="600" y="158" text-anchor="middle" font-family="'Courier New',Consolas,monospace" font-size="86" font-weight="700" letter-spacing="12" fill="#ff6fa5">HUAKUN</text>
  <text x="600" y="158" text-anchor="middle" font-family="'Courier New',Consolas,monospace" font-size="86" font-weight="700" letter-spacing="12" fill="#e8edf5">HUAKUN</text>

  <rect class="scan" x="0" y="0" width="1200" height="70" fill="url(#scanGrad)"/>

  <g class="br" fill="none" stroke="#ff6fa5" stroke-width="2">
    <path d="M44 44 H116 M44 44 V116"/>
    <path d="M1156 44 H1084 M1156 44 V116"/>
    <path d="M44 256 H116 M44 256 V184"/>
    <path d="M1156 256 H1084 M1156 256 V184"/>
  </g>

  <text x="600" y="214" text-anchor="middle" font-family="'Courier New',Consolas,monospace" font-size="16" letter-spacing="4" fill="#7d8899">XJTLU  /  YEAR 1  /  SUZHOU, CN</text>

  <g fill="#6fe3ff">
    <circle cx="150" cy="70" r="2"><animate attributeName="opacity" values="0;0.9;0" dur="3.6s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="230" r="1.6"><animate attributeName="opacity" values="0;0.8;0" dur="4.2s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="60" r="2.2"><animate attributeName="opacity" values="0;0.85;0" dur="3.1s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="255" r="1.4"><animate attributeName="opacity" values="0;0.7;0" dur="4.8s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="48" r="1.8"><animate attributeName="opacity" values="0;0.9;0" dur="3.9s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="248" r="2"><animate attributeName="opacity" values="0;0.75;0" dur="4.4s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="66" r="1.5"><animate attributeName="opacity" values="0;0.85;0" dur="3.3s" begin="2.0s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="236" r="2.1"><animate attributeName="opacity" values="0;0.8;0" dur="4.1s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="150" r="1.3"><animate attributeName="opacity" values="0;0.6;0" dur="5.2s" begin="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="150" r="1.3"><animate attributeName="opacity" values="0;0.6;0" dur="4.9s" begin="0.9s" repeatCount="indefinite"/></circle>
  </g>

  <g fill="#ff6fa5">
    <circle cx="90" cy="220" r="1.5"><animate attributeName="opacity" values="0;0.8;0" dur="4.6s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="1110" cy="90" r="1.5"><animate attributeName="opacity" values="0;0.8;0" dur="3.7s" begin="1.8s" repeatCount="indefinite"/></circle>
  </g>
</svg>
