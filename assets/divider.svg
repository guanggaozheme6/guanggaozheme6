<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="img" aria-label="divider">
  <style>
    .dash { animation: dashmove 3s linear infinite; }
    .dot  { animation: travel 4.5s linear infinite; }
    @keyframes dashmove { to { stroke-dashoffset: -96; } }
    @keyframes travel {
      0%   { transform: translateX(-20px); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateX(1220px); opacity: 0; }
    }
  </style>
  <line class="dash" x1="0" y1="12" x2="1200" y2="12" stroke="#1f2635" stroke-width="1" stroke-dasharray="6 6"/>
  <circle class="dot" cx="0" cy="12" r="2.5" fill="#ff6fa5"/>
</svg>
